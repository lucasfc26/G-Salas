# Development: Postgres + Redis + API + frontend (Vite).
#   docker compose up -d --build
#
# API:       http://localhost:3001
# Frontend:  http://localhost:5173
# Postgres:  localhost:5433
# Redis:     localhost:6379

services:
  postgres:
    image: postgres:17-alpine
    container_name: esalas-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: roomrentalad12ms!
      POSTGRES_DB: room_rental
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: esalas-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-alpine
    container_name: esalas-api-dev
    working_dir: /app
    command: sh -c "npm ci && npx prisma generate && npm run start:dev"
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - api_dev_node_modules:/app/node_modules
    env_file:
      - ./backend/.env.example
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:roomrentalad12ms!@postgres:5432/room_rental?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      STORAGE_PUBLIC_URL: http://localhost:3001/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: esalas-frontend-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: http://api:3001
    depends_on:
      - api

volumes:
  postgres_dev_data:
  redis_dev_data:
  api_dev_node_modules:
  frontend_dev_node_modules:
