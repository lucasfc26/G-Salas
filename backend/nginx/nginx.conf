# Reverse proxy in front of the NestJS api service (roadmap section 41).
# TLS is expected to terminate here (or at Cloudflare in front of this, with
# this proxying to it in "Full (strict)" mode) — the api container itself
# only ever speaks plain HTTP on the internal network.

# Complementary rate limiting at the edge, ahead of the app's own Redis-
# backed limiter — a cheap first line of defense against floods.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=1r/s;

upstream backend_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Uncomment once certs are mounted at /etc/nginx/certs (or terminate TLS
  # at Cloudflare instead and drop this whole block):
  # return 301 https://$host$request_uri;

  client_max_body_size 25m; # covers the 20MB contract-document upload limit
  gzip on;
  gzip_types application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location /api/v1/auth/login {
    limit_req zone=api_login burst=3 nodelay;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=api_general burst=40 nodelay;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

