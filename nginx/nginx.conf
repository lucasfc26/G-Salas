limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=1r/s;

# Docker embedded DNS. Variables in proxy_pass force re-resolve so a
# recreated api/frontend container does not leave nginx with a stale IP (502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  set $backend_api http://api:3000;
  set $frontend_app http://frontend:80;

  client_max_body_size 52m;
  gzip on;
  gzip_types application/json text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  location /api/v1/auth/login {
    limit_req zone=api_login burst=3 nodelay;
    proxy_pass $backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass $backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass $backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    rewrite ^/health(/.*)?$ /api/health$1 break;
    proxy_pass $backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass $frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
